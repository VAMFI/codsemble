name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        node:
          - 20
          - 22
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run repository checks
        run: npm run check

      - name: Validate skills and repository metadata
        run: node .github/scripts/validate-repository.mjs

      - name: Verify deterministic bundled CLI
        run: node .github/scripts/check-deterministic-build.mjs

      - name: Verify source payload checksums
        run: npm run checksums:verify

      - name: Verify deterministic SBOM
        run: npm run sbom:verify

      - name: Audit locked dependencies
        run: npm audit --audit-level=high
