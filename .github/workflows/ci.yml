name: CI

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        node:
          - 22
          - 24
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run repository checks
        run: npm run check

      - name: Validate skills and repository metadata
        run: node .github/scripts/validate-repository.mjs

      - name: Verify deterministic bundled CLI
        run: node .github/scripts/check-deterministic-build.mjs

      - name: Verify deterministic complete plugin archive
        run: npm run archive:verify

      - name: Verify source payload checksums
        run: npm run checksums:verify

      - name: Verify deterministic SBOM
        run: npm run sbom:verify

      - name: Confirm generated artifacts are clean
        shell: bash
        run: git diff --exit-code

      - name: Audit locked dependencies
        run: npm audit --audit-level=high
